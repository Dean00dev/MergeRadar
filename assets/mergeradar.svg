<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
<title id="title">MergeRadar</title>
<desc id="desc">A radar sweep over branching pull request paths.</desc>
<rect width="800" height="240" rx="28" fill="#0d1117"/>
<g transform="translate(120 120)" fill="none" stroke="#3fb950" stroke-width="4">
  <circle r="78" opacity=".25"/>
  <circle r="52" opacity=".35"/>
  <circle r="26" opacity=".5"/>
  <path d="M0 0 L66 -42" stroke-width="7"/>
  <path d="M-72 28 C-30 12 4 18 38 50" stroke="#58a6ff"/>
  <path d="M-58 -30 C-20 -8 18 -18 66 8" stroke="#f0883e"/>
  <circle cx="38" cy="50" r="7" fill="#58a6ff" stroke="none"/>
  <circle cx="66" cy="8" r="7" fill="#f0883e" stroke="none"/>
</g>
<text x="240" y="108" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="52" font-weight="700">MergeRadar</text>
<text x="242" y="154" fill="#8b949e" font-family="system-ui, sans-serif" font-size="22">Know what a pull request can affect before you merge it.</text>
</svg>
